<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Panorama Viewer — WebGPU HDR</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e2231a' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Panorama render canvas lives here -->
    <div id="stage">
      <canvas id="view"></canvas>

      <!-- Drop / empty state -->
      <div id="dropzone" class="dropzone">
        <div class="dropzone__inner">
          <h1 class="dropzone__title">Panorama Viewer</h1>
          <p class="dropzone__hint">
            Drag &amp; drop an <strong>equirectangular (2:1)</strong> image file, or click to choose.<br />
            <span class="muted">AVIF · PNG · JPG · Ultra HDR JPG · EXR · HDR</span>
          </p>
          <div class="dropzone__actions">
            <button id="pickBtn" class="btn">Choose file</button>
            <button id="demoBtn" class="btn btn--ghost">Load sample</button>
          </div>
          <input id="fileInput" type="file" accept="image/*,.jpg,.jpeg,.png,.avif,.exr,.hdr" hidden />

          <a
            class="dropzone__gh"
            href="https://github.com/realsee-developer/panorama-viewer"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View source on GitHub"
            title="View source on GitHub"
          >
            <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
              />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Top-left info / minimap panel -->
    <aside id="panel" class="panel" hidden>
      <header class="panel__head">
        <span class="panel__label">META</span>
      </header>

      <div class="panel__meta">
        <dl>
          <dt>Format</dt><dd id="metaFormat">—</dd>
          <dt>Resolution</dt><dd id="metaRes">—</dd>
          <dt>Aspect</dt><dd id="metaRatio">—</dd>
          <dt>HDR</dt><dd id="metaHdr">—</dd>
        </dl>
      </div>

      <!-- HDR boost control (shown for all HDR: Ultra HDR + converted EXR/HDR) -->
      <div id="hdrControl" class="panel__hdr" hidden>
        <div class="panel__hdrhead">
          <span class="panel__hdrlabel">HDR boost (maxDisplayBoost)</span>
          <span id="hdrBoostVal" class="panel__hdrval">—</span>
        </div>
        <input
          id="hdrBoost"
          class="slider"
          type="range"
          min="1"
          max="16"
          step="0.1"
          value="8"
        />
        <div class="panel__hdrscale">
          <span>1× (SDR)</span>
          <span id="hdrBoostMax">—</span>
        </div>
      </div>

      <!-- Minimap: equirectangular thumbnail + viewport overlay -->
      <figure class="panel__map">
        <canvas id="minimap"></canvas>
        <figcaption class="panel__maphint">Click the map to look that way</figcaption>
      </figure>
    </aside>

    <!-- HDR support status badge -->
    <!-- Status: always shows the same rows, before and after loading -->
    <div id="hdrBadge" class="hdrBadge" hidden>
      <div class="hdrBadge__row">
        <span class="hdrBadge__key">Display HDR</span>
        <span id="statDisplay" class="hdrBadge__val">Checking…</span>
      </div>
      <div class="hdrBadge__row">
        <span class="hdrBadge__key">Canvas output</span>
        <span id="statCanvas" class="hdrBadge__val no">SDR (8-bit)</span>
      </div>
    </div>

    <!-- Mobile: floating button to open minimap as modal -->
    <button id="mapToggle" class="mapToggle" hidden aria-label="Open minimap">◰</button>

    <!-- Toast / error messages -->
    <div id="toast" class="toast" hidden></div>

    <!-- Loading spinner -->
    <div id="loader" class="loader" hidden>
      <div class="loader__bar"><div class="loader__fill"></div></div>
      <span class="loader__text">Decoding…</span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
